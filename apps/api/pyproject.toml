[project]
name = "weiran-edu-api"
version = "0.1.0"
description = "Weiran EDU independent FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

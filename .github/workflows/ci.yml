name: I-05 Ubuntu diagnosis
on: workflow_dispatch
permissions:
  contents: read
env:
  WEIRAN_EDU_ENV: test
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
jobs:
  profile-probe:
    name: "Ubuntu ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: I-04-baseline
            revision: d4e6e1ffe8ceba56887c7291cc6b6014d094b49c
          - label: I-05-candidate
            revision: 536c512ec617f619f52ec1110c9b9595e2fdc0f2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: source/apps/api/.python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Locked isolated and ordered diagnostics
        working-directory: source/apps/api
        run: |
          git rev-parse HEAD
          uv sync --locked --group dev
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts:$PWD/../..:$PWD"
          file=tests/durable_teacher_agent/test_validation_performance.py
          target="$file::test_varied_formal_workbooks_are_isolated_and_match_database_scores"
          for seed in random random random 0 1 2 3 4 5 6 7; do
            if [ "$seed" = random ]; then unset I05_UUID_SEED; else export I05_UUID_SEED="$seed"; fi
            rc=0
            uv run --locked --no-sync pytest -q -s --tb=short -p i05_profile_probe "$target" || rc=$?
            echo "PROBE_RESULT isolated seed=$seed rc=$rc"
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          done
          for seed in 0 1 2 3 4 5 6 7; do
            export I05_UUID_SEED="$seed"
            rc=0
            uv run --locked --no-sync pytest -q -s --tb=short -p i05_profile_probe "$file::test_fact_ledger_reuse_invalidates_on_new_fact_and_mutation" "$target" || rc=$?
            echo "PROBE_RESULT adjacent seed=$seed rc=$rc"
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          done

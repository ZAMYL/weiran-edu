name: Windows shard validation
on:
  push:
    branches: [codex/edu-windows-shard-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-shards-${{ github.ref }}
  cancel-in-progress: false
env:
  WEIRAN_EDU_ENV: test
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  windows:
    name: Windows (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [core, ai_research, edu_import, reporting, teacher_bridge]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: apps/api/.python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Install locked dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Original Ruff gate
        working-directory: apps/api
        run: uv run --locked --no-sync ruff check .
      - name: Original format gate
        working-directory: apps/api
        run: uv run --locked --no-sync ruff format --check .
      - name: Run whole-file shard and record actual test outcomes
        run: uv run --project apps/api --locked --no-sync python scripts/windows_shards.py run --shard ${{ matrix.shard }}
      - name: Preserve actual outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.shard }}
          path: artifacts/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7
  coverage:
    name: Verify all original tests executed once
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: apps/api/.python-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: windows-*
          path: downloaded
      - name: Verify SHA, coverage, phases, failures and duplicates
        run: python scripts/windows_shards.py verify --artifacts downloaded --revision ${{ github.sha }} --output windows-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-summary
          path: windows-summary.json
          if-no-files-found: error
          retention-days: 7

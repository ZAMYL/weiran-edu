name: LIVE-02 acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to verify"
        required: true
        default: feat/live02-qwen-wiring
      mode:
        description: "dry_run (tests) | smoke (upload only) | live (real Qwen)"
        type: choice
        options:
          - dry_run
          - smoke
          - live
        default: dry_run
      expected_fingerprint:
        description: "Reviewed code fingerprint"
        required: true
        default: 18f5937215229948ccf0dde06738dccb38855cce324ef89d87d62e41227e57e1

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke upload (no model call)
    if: inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
      LIVE02_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: Install locked dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Fingerprint gate
        run: apps/api/.venv/bin/python "${{ github.workspace }}/scripts/live02_acceptance.py" check --expected-fingerprint "${{ inputs.expected_fingerprint }}"
      - name: Smoke upload (no model call)
        env:
          LIVE02_EVIDENCE: ${{ runner.temp }}/live02-evidence.json
        run: apps/api/.venv/bin/python "${{ github.workspace }}/scripts/live02_acceptance.py" smoke --expected-fingerprint "${{ inputs.expected_fingerprint }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live02-evidence
          path: |
            ${{ runner.temp }}/live02-evidence.json
            ${{ runner.temp }}/live02/*.log
            ${{ runner.temp }}/live02-smoke/*.log
          if-no-files-found: ignore

  acceptance:
    name: LIVE-02 acceptance
    if: inputs.mode != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: live02-production
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
      LIVE02_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: Install locked dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Fingerprint gate
        run: apps/api/.venv/bin/python "${{ github.workspace }}/scripts/live02_acceptance.py" check --expected-fingerprint "${{ inputs.expected_fingerprint }}"
      - name: Dry run tests
        if: inputs.mode == 'dry_run'
        working-directory: apps/api
        run: |
          .venv/bin/python -m pytest tests/edu/test_programming_live.py -q
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Live acceptance (real Qwen)
        if: inputs.mode == 'live'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
          WEIRAN_QWEN_MODEL: ${{ vars.WEIRAN_QWEN_MODEL }}
          LIVE02_HUMAN_APPROVAL_REFERENCE: ${{ vars.LIVE02_HUMAN_APPROVAL_REFERENCE }}
          LIVE02_INDEPENDENT_REVIEW_REFERENCE: ${{ vars.LIVE02_INDEPENDENT_REVIEW_REFERENCE }}
          LIVE02_EVIDENCE: ${{ runner.temp }}/live02-evidence.json
        run: apps/api/.venv/bin/python "${{ github.workspace }}/scripts/live02_acceptance.py" live --expected-fingerprint "${{ inputs.expected_fingerprint }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live02-evidence
          path: |
            ${{ runner.temp }}/live02-evidence.json
            ${{ runner.temp }}/live02/*.log
            ${{ runner.temp }}/live02-smoke/*.log
          if-no-files-found: ignore
